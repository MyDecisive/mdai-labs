apiVersion: hub.mydecisive.ai/v1
kind: MdaiHub
metadata:
  labels:
    app.kubernetes.io/name: mdai-operator
    app.kubernetes.io/managed-by: kustomize
  name: mdaihub-aer
  namespace: mdai
spec:
  variables:
    - key: tier_1_service_list
      serializeAs:
        - name: "TIER_1_SERVICE_LIST"
          transformers:
            - type: join
              join:
                delimiter: "|"
      dataType: set
      type: manual
      storageType: "mdai-valkey"

    - key: tier_2_3_service_list
      serializeAs:
        - name: "TIER_2_3_SERVICE_LIST"
          transformers:
            - type: join
              join:
                delimiter: "|"
      dataType: set
      type: manual
      storageType: "mdai-valkey"

    - key: tier_4_7_service_list
      serializeAs:
        - name: "TIER_4_7_SERVICE_LIST"
          transformers:
            - type: join
              join:
                delimiter: "|"
      dataType: set
      type: manual
      storageType: "mdai-valkey"

    # Tracks which services are currently firing (serialized for convenience in other pipelines)
    - key: service_list
      type: computed
      dataType: set
      storageType: "mdai-valkey"
      serializeAs:
        - name: "SERVICE_LIST_REGEX"
          transformers:
            - type: join
              join:
                delimiter: "|"

    - key: alerting_data_type
      type: computed
      dataType: string
      storageType: "mdai-valkey"
      serializeAs:
        - name: "ALERTING_DATA_TYPE"

    - key: alerting_triggered
      type: computed
      dataType: boolean
      storageType: "mdai-valkey"
      serializeAs:
        - name: "ALERT_TRIGGERED"

  prometheusAlerts:
    - name: t1_error_count
      expr: 'sum(increase(t1_error_count_total[5m])) by (mdai_service) > 0.1 * sum(avg_over_time(increase(t1_error_count_total[5m])[1h:])) by (mdai_service)'
      severity: warning
      for: 3m
      keep_firing_for: 3m

    - name: t2_3_error_count
      expr: 'sum(increase(t2_3_error_count[5m])) by (mdai_service) > 0.1 * sum(avg_over_time(increase(t2_3_error_count_total[5m])[1h:])) by (mdai_service)'
      severity: warning
      for: 3m
      keep_firing_for: 3m

    - name: t4_7_error_count
      expr: 'sum(increase(t4_7_error_count[5m])) by (mdai_service) > 0.1 * sum(avg_over_time(increase(t4_7_error_count_total[5m])[1h:])) by (mdai_service)'
      severity: warning
      for: 3m
      keep_firing_for: 3m

  rules:
  # Tier 1 bookkeeping
    - name: t1_error_count_resolved
      when:
        alertName: t1_error_count
        status: resolved
      then:
        - removeFromSet:
            set: service_list
            value: ${trigger:payload.labels.mdai_service}

    - name: t1_error_count_firing
      when:
        alertName: t1_error_count
        status: firing
      then:
        - addToSet:
            set: service_list
            value: ${trigger:payload.labels.mdai_service}
        - setVariable:
            scalar: alerting_data_type
            value: ${trigger:payload.labels.data_type}
        - setVariable:
            scalar: alerting_triggered
            value: "true"

    # Tier 2–3 bookkeeping
    - name: t2_3_error_count_resolved
      when:
        alertName: t2_3_error_count
        status: resolved
      then:
        - removeFromSet:
            set: service_list
            value: ${trigger:payload.labels.mdai_service}

    - name: t2_3_error_count_firing
      when:
        alertName: t2_3_error_count
        status: firing
      then:
        - addToSet:
            set: service_list
            value: ${trigger:payload.labels.mdai_service}

    # Tier 4–7 bookkeeping
    - name: t4_7_error_count_resolved
      when:
        alertName: t4_7_error_count
        status: resolved
      then:
        - removeFromSet:
            set: service_list
            value: ${trigger:payload.labels.mdai_service}

    - name: t4_7_error_count_firing
      when:
        alertName: t4_7_error_count
        status: firing
      then:
        - addToSet:
            set: service_list
            value: ${trigger:payload.labels.mdai_service}

    # Slack Notifications

    - name: t1_error_count_slack_notification
      when:
        alertName: t1_error_count
        status: firing
      then:
        - callWebhook:
            url:
              valueFrom:
                secretKeyRef:
                  name: slack-tier1-webhook-secret
                  key: url
            templateRef: slackAlertTemplate
            templateValues:
              labels_val_ref_primary: mdai_service
              message: "<!here> *TIER 1 SERVICE* !!RED ALERT!! Serious malfunction with tier 1 service!! Elevated for five minutes compared to the last hour!"
              link_url: http://localhost:9090/alerts
              link_text: See alert in Prometheus

    - name: t2_3_error_count_slack_notification
      when:
        alertName: t2_3_error_count
        status: firing
      then:
        - callWebhook:
            url:
              valueFrom:
                secretKeyRef:
                  name: slack-tier2-3-webhook-secret
                  key: url
            templateRef: slackAlertTemplate
            templateValues:
              labels_val_ref_primary: mdai_service
              message: "<@U07ECDU888M> *TIER 2-3 SERVICE* WARNING - error rate for tier 2-3 serivce elevated for five minutes compared to the last hour! Please investigate immediately!"
              link_url: http://localhost:9090/alerts
              link_text: See alert in Prometheus

    - name: t4_7_error_count_slack_notification
      when:
        alertName: t4_7_error_count
        status: firing
      then:
        - callWebhook:
            url:
              valueFrom:
                secretKeyRef:
                  name: slack-tier4-7-webhook-secret
                  key: url
            templateRef: slackAlertTemplate
            templateValues:
              labels_val_ref_primary: mdai_service
              message: "<!subteam^S095CM98XSS> *TIER 4-7 SERVICE* Attention app team - error rate for app level service elevated for five minutes compared to the last hour!"
              link_url: http://localhost:9090/alerts
              link_text: See alert in Prometheus