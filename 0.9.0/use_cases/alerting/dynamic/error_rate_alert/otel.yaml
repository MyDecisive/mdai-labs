apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  labels:
    mydecisive.ai/hub-name: mdaihub-aer
  name: gateway
  namespace: mdai
spec:
  managementState: managed
  image: otel/opentelemetry-collector-contrib:0.118.0
  replicas: 1
  resources:
    limits:
      memory: "256Mi"
      cpu: "200m"
    requests:
      memory: "128Mi"
      cpu: "100m"
  config:
    receivers:
      fluentforward:
        endpoint: "0.0.0.0:8006"

    extensions:
      health_check:
        endpoint: "${env:MY_POD_IP}:13133"

    processors:
      memory_limiter:
        check_interval: 23s
        limit_percentage: 75
        spike_limit_percentage: 15

      batch:
        timeout: 10s

      deltatocumulative: {}

    connectors:
      count:
        logs:
          t4_7_error_count:
            description: Counted error logs for services in tiers 4-7
            conditions:
              - 'attributes["level"] == "ERROR" and attributes["mdai_service"] != nil and attributes["mdai_service"] != "" and IsMatch(attributes["mdai_service"], "${env:TIER_4_7_SERVICE_LIST}")'
            attributes:
              - key: mdai_service
                default_value: ""
          t2_3_error_count:
            description: Counted error logs for services in tiers 2-3
            conditions:
              - 'attributes["level"] == "ERROR" and attributes["mdai_service"] != nil and attributes["mdai_service"] != "" and IsMatch(attributes["mdai_service"], "${env:TIER_2_3_SERVICE_LIST}")'
            attributes:
              - key: mdai_service
                default_value: ""
          t1_error_count:
            description: Counted error logs for services in tier 1
            conditions:
              - 'attributes["level"] == "ERROR" and attributes["mdai_service"] != nil and attributes["mdai_service"] != "" and IsMatch(attributes["mdai_service"], "${env:TIER_1_SERVICE_LIST}")'
            attributes:
              - key: mdai_service
                default_value: ""

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8899"
        metric_expiration: 180m
        resource_to_telemetry_conversion:
          enabled: true

    service:
      extensions: [health_check]
      pipelines:
        logs/counts:
          receivers: [fluentforward]
          processors: [memory_limiter, batch]
          exporters: [count]

        metrics/log_counts:
          receivers: [count]
          processors: [deltatocumulative, batch]
          exporters: [prometheus]