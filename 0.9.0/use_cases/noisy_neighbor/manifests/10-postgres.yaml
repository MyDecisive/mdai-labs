apiVersion: v1
kind: Secret
metadata:
  name: postgres-creds
  namespace: noisy-neighbor
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
  POSTGRES_DB: app
  DATA_SOURCE_NAME: postgresql://app:app@localhost:5432/app?sslmode=disable
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: noisy-neighbor
data:
  postgresql.conf: |
    listen_addresses = '*'
    max_connections = 100
    shared_buffers = 64MB
    work_mem = 1MB
    effective_cache_size = 128MB
    log_min_duration_statement = 1000
  init.sql: |
    CREATE TABLE IF NOT EXISTS items (id serial primary key, payload text);
    INSERT INTO items (payload) SELECT md5(g::text) FROM generate_series(1, 1000) g
      ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: noisy-neighbor
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: pg
          envFrom:
            - secretRef:
                name: postgres-creds
          args:
            - -c
            - config_file=/etc/postgres/postgresql.conf
          volumeMounts:
            - name: pgconf
              mountPath: /etc/postgres
            - name: pginit
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}

        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: DATA_SOURCE_NAME
          resources:
            requests: {cpu: "20m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}

      volumes:
        - name: pgconf
          configMap:
            name: postgres-config
            items:
              - key: postgresql.conf
                path: postgresql.conf
        - name: pginit
          configMap:
            name: postgres-config
            items:
              - key: init.sql
                path: init.sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: noisy-neighbor
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-exporter
  namespace: mdai
  labels:
    release: mdai
spec:
  namespaceSelector:
    matchNames: [noisy-neighbor]
  selector:
    matchLabels:
      app: postgres
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
